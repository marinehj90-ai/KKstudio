<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="1000" height="500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1208"/>
      <stop offset="50%" stop-color="#2d2010"/>
      <stop offset="100%" stop-color="#3a2a1a"/>
    </linearGradient>
    <linearGradient id="imgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c8a878"/>
      <stop offset="100%" stop-color="#8a6840"/>
    </linearGradient>
  </defs>
  <rect width="1000" height="500" fill="url(#bg)"/>
  <circle cx="150" cy="500" r="280" fill="#c8a060" fill-opacity="0.07"/>
  <circle cx="900" cy="0" r="200" fill="#8060a0" fill-opacity="0.05"/>
  <!-- 우측 이미지 -->
  <rect x="580" y="50" width="380" height="400" rx="8" fill="url(#imgGrad)"/>
  <rect x="580" y="50" width="380" height="400" rx="8" fill="rgba(0,0,0,0.15)"/>
