  <text x="60" y="145" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="rgba(255,255,255,0.55)" letter-spacing="3">SPRING COLLECTION 2025</text>
  <text x="60" y="215" font-family="Arial, sans-serif" font-size="52" font-weight="800" fill="#ffffff" letter-spacing="-1">봄의 시작,</text>
  <text x="60" y="278" font-family="Arial, sans-serif" font-size="52" font-weight="800" fill="#FF8C5A" letter-spacing="-1">새로운 향</text>
  <text x="60" y="330" font-family="Arial, sans-serif" font-size="15" fill="rgba(255,255,255,0.6)">12년차 뷰티 MD가 직접 고른 봄 향수 컬렉션</text>
  <rect x="60" y="368" width="160" height="44" rx="22" fill="#FF5E4F"/>
