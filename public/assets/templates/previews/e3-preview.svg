<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 500" width="750" height="500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1208"/>
      <stop offset="50%" stop-color="#2d2010"/>
      <stop offset="100%" stop-color="#3a2a1a"/>
    </linearGradient>
    <linearGradient id="imgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c8a878"/>
      <stop offset="100%" stop-color="#8a6840"/>
    </linearGradient>
  </defs>
  <rect width="750" height="500" fill="url(#bg)"/>
  <circle cx="375" cy="-60" r="300" fill="#c8a060" fill-opacity="0.06"/>
  <!-- 상단 이미지 영역 -->
  <rect x="50" y="40" width="650" height="240" rx="8" fill="url(#imgGrad)"/>
  <rect x="50" y="40" width="650" height="240" rx="8" fill="rgba(0,0,0,0.18)"/>
  <!-- 텍스트 (하단) -->
  <text x="375" y="338" font-family="Arial, sans-serif" font-size="13" fill="rgba(255,255,255,0.5)" text-anchor="middle" letter-spacing="3">SPRING COLLECTION 2025</text>
  <text x="375" y="390" font-family="Arial, sans-serif" font-size="42" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="-0.5">봄의 시작, 새로운 향</text>
  <text x="375" y="430" font-family="Arial, sans-serif" font-size="14" fill="rgba(255,255,255,0.55)" text-anchor="middle">12년차 뷰티 MD가 직접 고른 봄 향수 컬렉션</text>
  <rect x="275" y="452" width="200" height="38" rx="19" fill="#FF5E4F"/>
  <text x="375" y="476" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="white" text-anchor="middle">지금 보러가기 →</text>
</svg>
